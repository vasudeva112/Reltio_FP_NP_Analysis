# FPNP Analyzer settings. Relative paths are relative to this file.
# Any key can be overridden with an environment variable FPNP_<KEY> or --set KEY=VALUE.

# ---- inputs -------------------------------------------------------------
# Tenant connection (OAuth client credentials) is read from the extractor's file;
# secrets may instead come from RELTIO_CLIENT_CREDENTIALS or RELTIO_CLIENT_ID/RELTIO_CLIENT_SECRET.
TENANT_PROPERTIES=D:/Office/Reltio/Python/Potential_Matches/dev-ov_02.properties
L3_CONFIG_FILE=D:/Office/Reltio/Python/Potential_Matches/L3.json
# blank = ENTITY_TYPE from TENANT_PROPERTIES
ENTITY_TYPES=Individual
# blank / AllRules = every match group of ENTITY_TYPES (same syntax as the extractor's TARGET_RULE)
TARGET_RULE=
# comma-separated files or glob patterns written by Potential_Matches_Extract_v3.py
REPORT_FILES=D:/Office/Reltio/Python/Potential_Matches/Output.csv
# entity exports (JSON Lines / JSON array / directory); create with: python fpnp_analyzer.py export
ENTITY_EXPORT_PATHS=
STEWARD_DECISIONS_FILE=
# optional local copies of Reltio dictionaries (otherwise cleansers run as identity)
NAME_DICTIONARY_FILE=
REGEXP_REPLACE_DICTIONARY_FILE=
# NOISE_DICTIONARY_FILES=<url or name>=><local file>, ...
NOISE_DICTIONARY_FILES=
OUTPUT_DIR=output

# ---- comparison behaviour (labelled approximations) ---------------------
CASE_INSENSITIVE=yes
TREAT_BLANK_AS_NULL=yes
GLOBAL_CANDIDATE_POOLING=yes
# relevance_based groups (see DESIGN.md 3.2): veto | ignore  and  flat | max | mean
RELEVANCE_CONSTRAINT_MODE=ignore
RELEVANCE_NESTED_AGGREGATION=mean
# Double Metaphone code length (original algorithm / Apache Commons Codec: 4; 0 = unlimited)
DOUBLE_METAPHONE_MAX_LENGTH=4

# ---- candidate generation -----------------------------------------------
MAX_TOKEN_COLLISION=300
MAX_PHRASES_PER_ENTITY=2000
BLOCKING_ENABLED=yes
BLOCKING_MAX_BLOCK_SIZE=1000
BLOCKING_ATTRIBUTE_PAIRS=yes
BLOCKING_PHONETIC=yes
SORTED_NEIGHBORHOOD_WINDOW=10
EXHAUSTIVE=no
EXHAUSTIVE_MAX_ENTITIES=5000

# ---- processing ---------------------------------------------------------
BATCH_SIZE=5000
WORKERS=1
RESUME=yes
EXCEL_ROW_CAP=200000
WRITE_PARQUET=yes

# ---- false-positive risk scoring ----------------------------------------
FP_SUSPECT_THRESHOLD=5
FP_REVIEW_THRESHOLD=2
LOW_MARGIN=0.03
HIGH_FREQUENCY_ENTITIES=5
# RISK_WEIGHTS=FAILED_OPERAND_STILL_MATCHED:3,ONE_SIDED_NULL:1.5

# ---- comparator score report (FP_Score_Report.xlsx) ----------------------
# operators whose per-attribute result flags a pair, and the results that do
SCORE_OPERATORS=fuzzy
SCORE_TRIGGERS=Disagree,Partial,Null,Phonetic collision,Fuzzy collision
# comparator agreed but Jaro-Winkler similarity below this -> Phonetic / Fuzzy collision
SCORE_SIMILARITY_CUTOFF=0.85
# optional population segment: both entities need a crosswalk value matching the regex
SEGMENT_LABEL=Bene Record
SEGMENT_CROSSWALK_REGEX=^CIF:9000000
# show attribute values (names, addresses) in the HTML report - keep "no" for external sharing
HTML_INCLUDE_VALUES=no

# ---- tenant verification (read-only) ------------------------------------
VERIFY_SAMPLE_SIZE=50
VERIFY_MIN_INTERVAL_SEC=0.5
VERIFY_SEED=42

# ---- Reltio FP / FN analysis engine (reltio-fp / reltio-fn / UI) -------------
# exact / fuzzy operand when BOTH entities have no value: fail (documented) | pass | exclude
# Run "python fpnp_analyzer.py null-probe" to see which mode reproduces your tenant's potential matches.
BOTH_NULL_EXACT_MODE=fail
# JSON scoring model (bands, weights, null policy, FP / FN thresholds); blank = built-in defaults
SCORING_CONFIG_FILE=config/scoring_config.json
# optional: pairs already matched / linked (EntityURI1,EntityURI2[,Reason]) and loser,winner merge map
KNOWN_MATCHES_FILE=
MERGE_MAP_FILE=
# blocking strategies: reltio_tokens, rule_keys, rule_phonetic, pairs, custom (default) + single, sorted (opt-in)
FN_BLOCKING_STRATEGIES=
# custom blocking keys, ';'-separated: e.g. LastName+DoB;FirstName:phonetic+LastName;Identifiers.Value:digits
FN_CUSTOM_BLOCKING_KEYS=
FN_MAX_BLOCK_SIZE=500
# pairs that satisfy no rule are reported (as low-confidence near misses) only at or above this similarity
FN_MIN_SIMILARITY=60
